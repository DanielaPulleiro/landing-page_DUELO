<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <link rel="stylesheet" href="estilos.css">
    <title>Duelo ante una pérdida</title>
</head> 
<body>

    <header class="cabecera"> <!-- menu editable part superior -->
    <div class="conainer barra-navegacion"> 
        <a class="logo" href="#"> Elizabeth<span>Kübler-Ross</span></a> 
        <nav class="enlace-navegacion">

    <button 
        type="button"
        class="btn btn-outline-warning btn-sm"
        onclick="recalcular()"
    >
        RECALCULAR
    </button>

    <button 
        class="btn btn-light btn-sm"
        onclick="cambiarModo()"
    >
        oscuro / claro
    </button>

</nav>
        
    </div>

</header>  <!-- totes les seccions que hi ha en la langing, i les section son les parts dels links del menu -->

   



<section class="pantalla-completa">

    <div class="card experiencia-card p-5">

        <h1 class="titulo mb-4">
            Cuenta tu experiencia
        </h1>

        <p class="mb-4">
            Describe cómo te sientes tras la pérdida.
        </p>

        <textarea 
            id="textoUsuario"
            class="form-control mb-4"
            rows="8"
            placeholder="Escribe aquí..."
        ></textarea>

        <button 
            class="btn btn-warning btn-lg"
            onclick="analizarDol()"
        >
            Analizar experiencia
        </button>

        <div id="resultado" class="resultado mt-5"></div>

    </div>

</section>


<footer class="pie"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="app.js"></script>

</body>
</html>
